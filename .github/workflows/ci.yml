name: CI · 冒烟测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 启动服务
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "服务已就绪"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health

      - name: 运行端到端测试
        run: python tests_smoke.py http://127.0.0.1:8000

      - name: 失败时输出服务日志
        if: failure()
        run: tail -60 server.log
